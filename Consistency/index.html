<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Build daily consistency: solve a tiny puzzle, log the habit, keep the chain alive."
    />
    <!-- Installing to the home screen exempts the app from Safari's 7-day
         localStorage eviction, so the manifest is a data-safety feature here. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Consistency" />
    <title>Consistency — one small day at a time</title>
  </head>
  <body>
    <script>
      // Resolve the theme before first paint so there is no light/dark flash.
      try {
        var t = localStorage.getItem('consistency.theme.v1')
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = t
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
