name = "consistency-reminders"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Every minute. Reminders can be set to any time, so a coarser schedule would
# deliver late; Cloudflare allows minute granularity on the free plan.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "consistency"
database_id = "ffa6bc20-0535-4447-ac2a-dab7a4262bc3"

[vars]
# Comma-separated list of origins allowed to call the API. The deployed site
# must be listed here or the browser blocks every request as a CORS failure.
# Vercel preview deployments get their own hostnames, so they are not covered —
# add one here if you ever need to test the cloud features on a preview.
ALLOWED_ORIGIN = "https://project-of-consistency.vercel.app,http://localhost:5173"
# Contact address for push services, per the VAPID spec — they use it to reach
# you if this sender starts misbehaving.
VAPID_SUBJECT = "mailto:livnaveen@gmail.com"

# VAPID_PUBLIC_KEY and VAPID_PRIVATE_KEY are secrets, not vars:
#   wrangler secret put VAPID_PUBLIC_KEY
#   wrangler secret put VAPID_PRIVATE_KEY
